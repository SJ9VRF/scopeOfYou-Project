<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Scope of You architecture — Aura Yavary</title>
<desc id="desc">Closed loop from user simulation and data through SFT, reward modeling, optimization, evaluation, failure mining, constrained repair, and serving.</desc>
<style>
  .box{fill:#fff;stroke:#111;stroke-width:2;rx:14}.head{font:700 22px sans-serif}.txt{font:16px sans-serif}.small{font:14px sans-serif}.arrow{stroke:#111;stroke-width:2.5;fill:none;marker-end:url(#m)}
</style>
