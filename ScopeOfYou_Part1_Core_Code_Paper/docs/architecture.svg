<rect x="900" y="245" width="220" height="105" class="box"/><text x="1010" y="282" text-anchor="middle" class="head">Optimization</text><text x="1010" y="311" text-anchor="middle" class="txt">raw reward objective</text>
<rect x="610" y="245" width="220" height="105" class="box"/><text x="720" y="282" text-anchor="middle" class="head">PersonalBench</text><text x="720" y="311" text-anchor="middle" class="txt">held-out users + CI</text>
<rect x="320" y="245" width="220" height="105" class="box"/><text x="430" y="282" text-anchor="middle" class="head">Failure mining</text><text x="430" y="311" text-anchor="middle" class="txt">taxonomy • hard cases</text>
